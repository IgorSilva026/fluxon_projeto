<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha · Fluxon Analytics</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main class="card">
  <div class="logo">Fluxon<span>Analytics</span></div>
  <h1>Recuperar senha</h1>
  <p>Informe seu e-mail. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.</p>
  <form action="redefinir.html" method="get">
    <label for="email">E-mail cadastrado</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button class="btn" type="submit">Enviar link</button>
  </form>
  <p class="links"><a href="login.html">Voltar ao login</a></p>
</main>
</body></html>
