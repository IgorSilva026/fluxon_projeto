<!doctype html>
<html lang="pt-br">
<head>

<title>Entrar · Fluxon Analytics</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main class="card">
  <div class="logo">Fluxon<span>Analytics</span></div>
  <h1>Entrar</h1>

    <input type="hidden" name="csrf" value="{{csrf}}">

    <button class="btn" type="submit">Entrar</button>
  </form>
  {{google:Entrar com Google}}
