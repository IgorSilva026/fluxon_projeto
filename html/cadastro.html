<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta · Fluxon Analytics</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main class="card">
  <div class="logo">Fluxon<span>Analytics</span></div>
  <h1>Criar conta</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocomplete="name" value="{{valor:nome}}" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{valor:email}}" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}" title="Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo" required>
    <small>Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
    <label for="senha2">Confirmar senha</label>
    <input id="senha2" name="senha2" type="password" autocomplete="new-password" required>
    <button class="btn" type="submit">Cadastrar</button>
  </form>
  <p class="links"><a href="?p=login">Já tenho conta</a></p>
</main>
<script>
(function(){var a=document.getElementById('senha'),b=document.getElementById('senha2');
function v(){b.setCustomValidity(a.value===b.value?'':'As senhas não coincidem.');}
a.addEventListener('input',v);b.addEventListener('input',v);})();
</script>
</body></html>
