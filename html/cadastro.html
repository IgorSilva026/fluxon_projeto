
<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#f5f7f8">

  <title>Criar conta · Fluxon Analytics</title>

  <!-- Design System -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/accessibility.css">
  <link rel="stylesheet" href="../assets/css/compact.css">

  <!-- Senhas -->
  <link rel="stylesheet" href="../assets/css/password.css">
  <link rel="stylesheet" href="../assets/css/password-visibility.css">
</head>

<body>

<main class="card">

  <div class="logo">
    Fluxon<span>Analytics</span>
  </div>

  <h1>Criar conta</h1>

  <form method="post">

    <input
      type="hidden"
      name="csrf"
      value="{{csrf}}"
    >

    <!-- Nome -->

    <label for="nome">Nome</label>

    <input
      id="nome"
      name="nome"
      type="text"
      autocomplete="name"
      value="{{valor:nome}}"
      required
    >

    <!-- E-mail -->

    <label for="email">E-mail</label>

    <input
      id="email"
      name="email"
      type="email"
      autocomplete="email"
      value="{{valor:email}}"
      required
    >

    <!-- Senha -->

    <label for="senha">Senha</label>

    <div class="password-wrap">
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="new-password"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{8,}"
        title="Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo"
        required
      >
    </div>

    <small>
      Mínimo de 8 caracteres, com maiúscula,
      minúscula, número e símbolo.
    </small>

    <!-- Confirmação -->

    <label for="senha2">Confirmar senha</label>

    <div class="password-wrap">
      <input
        id="senha2"
        name="senha2"
        type="password"
        autocomplete="new-password"
        required
      >
    </div>

    <!-- Botão -->

    <button class="btn" type="submit">
      Cadastrar
    </button>

  </form>

  <p class="links">
    <a href="?p=login">Já tenho conta</a>
  </p>

</main>

<script>
(function () {
  const senha = document.getElementById('senha');
  const confirmacao = document.getElementById('senha2');

  function validarSenhas() {
    confirmacao.setCustomValidity(
      senha.value === confirmacao.value
        ? ''
        : 'As senhas não coincidem.'
    );
  }

  senha.addEventListener('input', validarSenhas);
  confirmacao.addEventListener('input', validarSenhas);
})();
</script>

<script src="../assets/js/password-visibility.js" defer></script>

</body>
</html>
